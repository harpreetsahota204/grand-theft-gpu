[project]
name = "gta-build-off"
version = "0.1.0"
description = "Harness for the $100 GTA Build-Off: race two models in Claude Code, routed and metered by Nexus."
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
dependencies = [
    "huggingface-hub>=2.4.0",
    "pillow>=13.0.0",
    "playwright>=1.48",
]

[project.scripts]
buildoff = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# Google-style docstrings with third-person summaries ("Loads...").
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
